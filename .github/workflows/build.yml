name: Build DroidDesk APK

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Stage wlroots native deps
        run: bash fetch_deps.sh

      - name: Write local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_SDK" "$ANDROID_HOME" \
            > app/android/local.properties
          cat app/android/local.properties

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/DroidDesk-release.apk

      - name: Build daily-driver APK (com.orailnoor.droiddesk.preview)
        working-directory: app
        env:
          DROIDDESK_PREVIEW: "1"
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/DroidDesk-Preview-release.apk

      - name: Verify APK package names
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          check() {
            badging="$("$AAPT2" dump badging "$1")"
            echo "$badging" | grep -E "^(package|application-label):"
            echo "$badging" | grep "^package: name='$2'" > /dev/null || { echo "::error::$1 is not $2"; exit 1; }
          }
          check dist/DroidDesk-release.apk com.orailnoor.droiddesk
          check dist/DroidDesk-Preview-release.apk com.orailnoor.droiddesk.preview
          "$AAPT2" dump badging dist/DroidDesk-Preview-release.apk | grep "application-label:'DroidDesk'" > /dev/null \
            || { echo "::error::Preview APK must be labelled DroidDesk"; exit 1; }
          for apk in dist/DroidDesk-release.apk dist/DroidDesk-Preview-release.apk; do
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" | grep "android.intent.category.HOME" > /dev/null \
              || { echo "::error::$apk must declare a HOME intent filter"; exit 1; }
          done
          python3 scripts/apk_manifest.py dist/DroidDesk-Preview-release.apk
          unzip -l dist/DroidDesk-Preview-release.apk | grep "lib/arm64-v8a/libsocket_hook_variant.so" > /dev/null
          unzip -p dist/DroidDesk-Preview-release.apk lib/arm64-v8a/libsocket_hook_variant.so \
            | strings | grep -x "/data/user/0/com.orailnoor.droiddesk.preview/files/usr" > /dev/null
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-release-${{ github.sha }}
          path: dist/DroidDesk-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Preview-release-${{ github.sha }}
          path: dist/DroidDesk-Preview-release.apk
          retention-days: 30

      - name: Dart tests
        working-directory: app
        run: flutter test

      - name: JVM unit tests
        working-directory: app/android
        run: ./gradlew :app:testReleaseUnitTest --no-daemon
